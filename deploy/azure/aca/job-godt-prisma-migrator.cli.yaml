identity:
  type: UserAssigned
  userAssignedIdentities:
    /subscriptions/bce68201-72d6-452a-8aa9-31b15d163096/resourceGroups/rg-godt-demo-ncus/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-godt-migrator:
      {}
properties:
