name: ca-godt-api
type: Microsoft.App/containerApps
location: northcentralus
identity:
  type: UserAssigned
  userAssignedIdentities:
    /subscriptions/bce68201-72d6-452a-8aa9-31b15d163096/resourceGroups/rg-godt-demo-ncus/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-godt-api: {}
properties:
  managedEnvironmentId: /subscriptions/bce68201-72d6-452a-8aa9-31b15d163096/resourceGroups/rg-godt-demo-ncus/providers/Microsoft.App/managedEnvironments/cae-godt-demo-ncus
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: false
      targetPort: 3000
      transport: auto
    registries:
      - server: acrgodtdemoncus01.azurecr.io
        identity: /subscriptions/bce68201-72d6-452a-8aa9-31b15d163096/resourceGroups/rg-godt-demo-ncus/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-godt-api
    secrets:
      - name: database-url
        value: __SET_SECURELY_AT_DEPLOYMENT__
      - name: jwt-secret
        value: __SET_SECURELY_AT_DEPLOYMENT__
  template:
    containers:
      - name: api
        image: acrgodtdemoncus01.azurecr.io/godt-api:__IMAGE_TAG_AFTER_COMMIT__
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: NODE_ENV
            value: production
          - name: APP_MODE
            value: api
          - name: PORT
            value: "3000"
          - name: DATABASE_URL
            secretRef: database-url
          - name: BULLMQ_BACKEND
            value: postgres
          - name: BULLMQ_PG_SCHEMA
            value: bullmq
          - name: JWT_SECRET
            secretRef: jwt-secret
          - name: JWT_ISSUER
            value: godt-backend
          - name: JWT_AUDIENCE
            value: godt-frontend
          - name: JWT_ACCESS_EXPIRES_IN
            value: 15m
          - name: REFRESH_TOKEN_TTL_DAYS
            value: "7"
          - name: REFRESH_COOKIE_NAME
            value: godt_refresh_token
          - name: AUTH_COOKIE_SECURE
            value: "true"
          - name: AUTH_COOKIE_SAMESITE
            value: strict
          - name: TRUST_PROXY
            value: "true"
          - name: CORS_ORIGIN
            value: __GATEWAY_PUBLIC_ORIGIN__
          - name: SWAGGER_ENABLED
            value: "false"
          - name: STORAGE_PROVIDER
            value: azure
          - name: AZURE_STORAGE_ACCOUNT_URL
            value: https://godtdemostgncus01.blob.core.windows.net
          - name: AZURE_STORAGE_CONTAINER
            value: clinical-documents
        probes:
          - type: Startup
            tcpSocket:
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          - type: Liveness
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          - type: Readiness
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
    scale:
      minReplicas: 1
      maxReplicas: 2
